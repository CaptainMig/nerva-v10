<canvas id="stage" tabindex="0" role="img" aria-label="Animated replay of one decision episode gated by NERVA: evidence is good, commit; a feed goes stale, wait; a spoofed feed agrees with the stale one, hold; evidence recovers and the gate waits for margin and dwell before committing again, while a plain threshold flips repeatedly."></canvas>

<script>
'use strict';
/* ============================================================
   NERVA replay demo — Starpoint LLC
   One seed, deterministic. Everything on screen is a pure
   function of time t and the precomputed replay below.
   Illustrative replay, simulation. Not a fielded system.
   ============================================================ */

/* ---------- deterministic RNG (mulberry32) ---------- */
const SEED = 11;
function mulberry32(a){return function(){a=(a+0x6D2B79F5)|0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const rnd = mulberry32(SEED);
function gauss(){const u1=Math.max(rnd(),1e-12),u2=rnd();return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);}
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16).padStart(8,'0');}

/* ---------- kernel: J, Θ and rule guards, ported from nerva-v11-core.jsx ---------- */
const CONF_WEIGHTS={E:0.15,S:0.15,R:0.15,Sp:0.275,St:0.275};
const TAU_BASE=0.25,TAU_E=0.35,TAU_R=0.25,TAU_REV=0.15;
const BRAKE_REV=0.4,BRAKE_I=0.55,BRAKE_IC=0.6,TOXIC_I_MAX=0.30,TOXIC_R_MIN=0.65,EMERG_U=0.75,EMERG_REV_MAX=0.4;
const SQRT3=Math.sqrt(3);
const clamp01=x=>Math.max(0,Math.min(1,Number.isFinite(x)?x:0));
function evaluate(v,c){
  const pure={r_x:(v.E+v.S)/(2*SQRT3),r_y:v.R/SQRT3,r_z:(v.Sp*v.St)/SQRT3};
  pure.magnitude=Math.hypot(pure.r_x,pure.r_y,pure.r_z);
  const C=CONF_WEIGHTS.E*c.E+CONF_WEIGHTS.S*c.S+CONF_WEIGHTS.R*c.R+CONF_WEIGHTS.Sp*c.Sp+CONF_WEIGHTS.St*c.St;
  const r=C*pure.magnitude;
  const lp=0.5*(1+r),lm=0.5*(1-r),term=l=>l<=0?0:-l*Math.log2(l);
  const entropy=term(lp)+term(lm);
  const integrity=v.Sp*v.St, reversibility=(v.Sp+v.St)/2, ev=v.Sp-v.R;
  const tau=TAU_BASE+TAU_E*entropy+TAU_R*v.R-TAU_REV*reversibility;
  let guard=null;
  if(integrity<TOXIC_I_MAX&&v.R>TOXIC_R_MIN) guard='TOXIC';
  else if(v.E>=EMERG_U&&reversibility<EMERG_REV_MAX) guard='ESCALATE';
  else{
    const irreversible=reversibility<BRAKE_REV, weakI=integrity<BRAKE_I, lowIC=((c.Sp+c.St)/2)<BRAKE_IC;
    if(irreversible&&(weakI||lowIC)) guard='ESCALATE';
  }
  return {J:r,theta:tau,C,entropy,integrity,reversibility,ev,guard,evBlock:ev<0};
}
function tier(c){ if(c>=0.95)return'Instrumented'; if(c>=0.80)return'Audited'; if(c>=0.50)return'Structured'; if(c>=0.30)return'Rough'; return'Guess'; }

/* ---------- the episode ---------- */
const DT=0.1, T_REPLAY=66, N=Math.round(T_REPLAY/DT)+1;
const DELTA=0.08;          // margin above Θ required before resuming

  const cap=captionAt(s);
  // fade in on change: find when this caption started
  const starts={commit1:0,stale:T_STALE,wait:EV.wait,hold:EV.hold,recover:T_RECOVER,commit2:EV.commit};
  const a=Math.min(1,(s-(starts[cap.k]||0))/0.35);
  ctx.save(); ctx.globalAlpha=a;
  const size=R.w>900*u?34:32;
  const total=wrap(cap.text,R.x,R.y+size*u*1.1,R.w,{size,weight:400,lh:1.28,color:PAL.ink});
  ctx.restore();
}
function drawInputs(R,s,f){
  const names=[['E','Urgency'],['S','Strategy'],['R','Risk'],['Sp','Support'],['St','Stability']];
  const cw=R.w/5, cH=R.h;
  const lines=R.w>900*u?[0.28,0.62,0.9]:[0.3,0.63,0.92];
  names.forEach(([k,label],i)=>{
    const x=R.x+i*cw, cv=f.c[k], t=tier(cv);
    const tcol=cv>=0.8?PAL.ink:cv>=0.5?PAL['ink-2']:PAL.wait;
    text(label,x,R.y+cH*lines[0],{size:22,color:PAL['ink-2']});
    text(f.v[k].toFixed(2),x,R.y+cH*lines[1],{size:34,mono:true,weight:500});
    text(t,x,R.y+cH*lines[2],{size:19,mono:true,color:tcol});
  });
}
function drawTrace(R,s,f){
  const top=R.y+44*u, bottom=R.y+R.h-30*u, left=R.x+56*u, right=R.x+R.w-6*u;
  const yMin=0.30,yMax=0.68;
  const X=t=>left+(t/T_REPLAY)*(right-left), Y=v=>bottom-((v-yMin)/(yMax-yMin))*(bottom-top);
  text('J(a | E, U, C) ≥ Θ(a, C)',R.x,R.y+14*u,{size:24,mono:true,weight:500});
  text(`J ${f.J.toFixed(3)}  Θ ${f.theta.toFixed(3)}`,right,R.y+14*u,{size:22,mono:true,color:PAL['ink-2'],align:'right'});
  // axes
  ctx.strokeStyle=PAL.rule; ctx.lineWidth=1.5*u;
  [0.3,0.4,0.5,0.6].forEach(v=>{ctx.beginPath();ctx.moveTo(left,Y(v));ctx.lineTo(right,Y(v));ctx.stroke();text(v.toFixed(1),left-10*u,Y(v)+6*u,{size:18,mono:true,color:PAL['ink-3'],align:'right'});});
  [0,20,40,60].forEach(t=>text(t+' s',X(t),bottom+22*u,{size:18,mono:true,color:PAL['ink-3'],align:t?'center':'left'}));
  const iEnd=f.i;
  // bar Θ and Θ+δ
  const line=(get,color,dash,width)=>{ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();let on=false;
    for(let i=0;i<=iEnd;i++){const v=get(frames[i]);if(v==null){on=false;continue;}const x=X(frames[i].s),y=Y(v);on?ctx.lineTo(x,y):ctx.moveTo(x,y);on=true;}ctx.stroke();ctx.setLineDash([]);};
  line(fr=>fr.theta+DELTA,PAL.theta,[2*u,6*u],1.5*u);
  line(fr=>fr.theta,PAL.theta,[9*u,6*u],2.5*u);
  // what agreement would have counted
  line(fr=>fr.Jalt,PAL.hold,[3*u,5*u],2*u);
  // J
  line(fr=>fr.J,PAL.j,[],3.5*u);
  // labels on the bar
  text('Θ',right+2*u,Y(f.theta)+7*u,{size:20,mono:true,color:PAL.theta,align:'left'});
  text('+δ',right+2*u,Y(f.theta+DELTA)+7*u,{size:17,mono:true,color:PAL.theta,align:'left',alpha:.8});
  if(f.dActive||(s>=T_RECOVER&&s<T_RECOVER+2)){
    const fr=frames[frameAt(T_RELAY).i];
    const a=f.dActive?Math.min(1,(s-T_RELAY)/0.4):1-(s-T_RECOVER)/2;
    text('J if the relay were trusted',X(fr.s),Y(fr.Jalt)+30*u,{size:18,mono:true,color:PAL.hold,align:'left',alpha:a});
  }
  // current point
  ctx.fillStyle=PAL.j; ctx.beginPath(); ctx.arc(X(f.s),Y(f.J),6*u,0,7); ctx.fill();
  ctx.fillStyle=PAL.j; text('J',X(f.s)+12*u,Y(f.J)+8*u,{size:20,mono:true,weight:500,color:PAL.j});
}
function drawTracks(R,s,f){
  const left=R.x, right=R.x+R.w, X=t=>left+(t/T_REPLAY)*(right-left);
  const rowH=R.h/2, barH=Math.min(26*u,rowH*0.28);
  const rows=[['NERVA gate',`margin ${DELTA.toFixed(2)} · dwell ${DWELL_S.toFixed(1)} s`,fr=>fr.nerva,fr=>fr.changed&&fr.i>0,flips.nerva],
              ['Plain threshold','same J, same Θ · commits whenever J ≥ Θ',fr=>fr.plain,fr=>fr.plainChanged,flips.plain]];
  rows.forEach(([name,sub,get,flipped,total],r)=>{
    const y0=R.y+r*rowH, by=y0+rowH*0.46;
    text(name,left,y0+rowH*0.3,{size:24,weight:600});
    text(sub,left+(r?0:0)+ctx.measureText(name).width+14*u,y0+rowH*0.3,{size:18,mono:true,color:PAL['ink-3']});
    // count so far
    let count=0; for(let i=0;i<=f.i;i++) if(flipped(frames[i])) count++;
    text(`${count} flip${count===1?'':'s'}`,right,y0+rowH*0.3,{size:22,mono:true,weight:500,align:'right',color:count>8?PAL.hold:PAL.ink});
    ctx.fillStyle=PAL.rule; rrect(left,by,right-left,barH,barH/2); ctx.fill();
    // segments
    let start=0, cur=get(frames[0]);
    const seg=(i0,i1,v)=>{ctx.fillStyle=VC(v);const x0=X(frames[i0].s),x1=X(frames[i1].s)+Math.max(1,(right-left)/N);ctx.fillRect(x0,by,x1-x0,barH);};
    ctx.save(); rrect(left,by,right-left,barH,barH/2); ctx.clip();
    for(let i=1;i<=f.i;i++){const v=get(frames[i]);if(v!==cur){seg(start,i-1,cur);start=i;cur=v;}}
    seg(start,f.i,cur);
    ctx.restore();
    for(let i=1;i<=f.i;i++) if(flipped(frames[i])){ctx.strokeStyle=PAL.ink;ctx.lineWidth=1.5*u;ctx.beginPath();ctx.moveTo(X(frames[i].s),by-5*u);ctx.lineTo(X(frames[i].s),by+barH+5*u);ctx.stroke();}
    // verdict word at the live end
    const v=get(f); text(v,Math.min(right-ctx.measureText(v).width,X(f.s)+10*u),by+barH+26*u,{size:19,mono:true,weight:500,color:VC(v)});
  });
}
function drawFooter(R,s,t){
  const y=R.y+R.h*0.55;
  text('Starpoint LLC',R.x,y,{size:22,weight:600,color:PAL['ink-2']});
  ctx.font=font(22,600); const w1=ctx.measureText('Starpoint LLC').width;
  text('miglanthony@gmail.com',R.x+w1+16*u,y,{size:22,color:PAL['ink-3']});
  text(`seed ${SEED} · ${DT.toFixed(1)} s tick · t ${Math.max(0,Math.min(T_REPLAY,t-T_TITLE)).toFixed(1).padStart(4,' ')} s`,R.x+R.w,y,{size:20,mono:true,color:PAL['ink-3'],align:'right'});
}
function drawReceipt(L,s){
  const SHOW=4.8;
  const r=[...receipts].reverse().find(r=>s>=r.s&&s<r.s+SHOW); if(!r)return;
  const a=s-r.s, alpha=Math.min(1,a/0.3)*(a>SHOW-0.5?(SHOW-a)/0.5:1), rise=(1-ease(a/0.35))*24*u;
  const F=L.field, w=Math.min(F.w-40*u,540*u), h=L.portrait?228*u:244*u, x=F.x+F.w-w-20*u, y=F.y+F.h-Math.min(F.h*0.30,150*u)-h-18*u+rise;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle=PAL.panel; ctx.shadowColor='rgba(0,0,0,0.25)'; ctx.shadowBlur=24*u; ctx.shadowOffsetY=8*u; rrect(x,y,w,h,12*u); ctx.fill(); ctx.shadowColor='transparent';
  ctx.strokeStyle=PAL.rule; ctx.lineWidth=1.5*u; ctx.stroke();
  ctx.fillStyle=VC(r.verdict); ctx.fillRect(x,y+12*u,6*u,h-24*u);
  const px=x+24*u;
  text(`receipt ${r.n} · ${r.hash} · t ${r.s.toFixed(1)} s`,px,y+30*u,{size:17,mono:true,color:PAL['ink-3']});
  text(r.verdict,px,y+74*u,{size:40,weight:600,color:VC(r.verdict)});
  const cmp=r.verdict==='COMMIT'?`J ${r.J.toFixed(3)} ≥ Θ ${r.theta.toFixed(3)}`:r.J<r.theta?`J ${r.J.toFixed(3)} < Θ ${r.theta.toFixed(3)}`:`J ${r.J.toFixed(3)} < Θ+δ ${(r.theta+DELTA).toFixed(3)}`;
  text(cmp,x+w-20*u,y+74*u,{size:21,mono:true,color:PAL['ink-2'],align:'right'});
  wrap(r.why,px,y+108*u,w-44*u,{size:19,lh:1.3,color:PAL.ink});
  const tiers=`E ${r.v.E.toFixed(2)}/${tier(r.c.E)[0]}  S ${r.v.S.toFixed(2)}/${tier(r.c.S)[0]}  R ${r.v.R.toFixed(2)}/${tier(r.c.R)[0]}  Sp ${r.v.Sp.toFixed(2)}/${tier(r.c.Sp)[0]}  St ${r.v.St.toFixed(2)}/${tier(r.c.St)[0]}`;
  text(tiers,px,y+h-20*u,{size:16,mono:true,color:PAL['ink-3']});
  ctx.restore();
}
function drawTitle(t){
  const a=t<T_TITLE-0.6?1:Math.max(0,(T_TITLE-t)/0.6);
  if(a<=0)return;
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=PAL.bg; ctx.fillRect(0,0,W,H);
  const cx=W/2, cy=H*0.44, s1=Math.min(1,t/0.5);
  ctx.globalAlpha=a*s1;
  text('NERVA',cx,cy,{size:W<=H?150:140,weight:600,align:'center'});
  ctx.globalAlpha=a*Math.min(1,Math.max(0,(t-0.4)/0.5));
  wrap('A gate between an autonomous agent and its actuators.',cx,cy+60*u,Math.min(W-2*L0.pad,820*u),{size:34,color:PAL['ink-2'],align:'center',lh:1.3});
  ctx.globalAlpha=a*Math.min(1,Math.max(0,(t-0.8)/0.5));
  text('Illustrative replay, one seed, simulation.',cx,cy+190*u,{size:24,mono:true,color:PAL['ink-3'],align:'center'});
  text('Starpoint LLC · miglanthony@gmail.com',cx,cy+230*u,{size:20,mono:true,color:PAL['ink-3'],align:'center'});
  ctx.restore();
}
function drawEnd(t){
  const a=Math.min(1,(t-T_END)/0.8); if(a<=0)return;
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=PAL.bg; ctx.fillRect(0,0,W,H);
  const portrait=W<=H, cx=W/2, maxW=Math.min(W-2*L0.pad,portrait?900*u:1200*u);
  let y=portrait?H*0.22:H*0.20;
  text('One episode, one seed, 66 seconds.',cx,y,{size:28,mono:true,color:PAL['ink-3'],align:'center'}); y+=portrait?130*u:110*u;
  const colW=maxW/2, big=portrait?150:130;
  const stat=(n,label,sub,x,col)=>{text(String(n),x,y,{size:big,weight:600,align:'center',color:col});
    text(label,x,y+56*u,{size:26,align:'center',color:PAL.ink});
    wrap(sub,x,y+100*u,colW*0.92,{size:19,mono:true,color:PAL['ink-3'],align:'center',lh:1.35});};
  stat(flips.plain,'verdict flips, plain threshold','same J, same Θ, no margin, no dwell',cx-colW/2,PAL.hold);
  stat(flips.nerva,'verdict flips, NERVA gate',`brake at once; resume after Θ + ${DELTA.toFixed(2)} holds ${DWELL_S.toFixed(1)} s`,cx+colW/2,PAL.commit);
  y+=portrait?240*u:210*u;
  if(recommit.plain!=null&&recommit.nerva!=null)
    wrap(`Both counted from the replay. NERVA resumed ${(recommit.nerva-recommit.plain).toFixed(1)} s after the plain threshold first did.`,cx,y,Math.min(maxW,portrait?760*u:1000*u),{size:22,mono:true,color:PAL['ink-2'],align:'center',lh:1.4});
  y+=portrait?150*u:120*u;
  const a2=Math.min(1,Math.max(0,(t-T_END-1.2)/0.8)); ctx.globalAlpha=a*a2;
  const lineW=Math.min(maxW,portrait?880*u:1100*u);
  wrap('Action requires sufficient justification. Resuming requires more than beginning.',cx,y,lineW,{size:portrait?52:50,weight:600,lh:1.22,align:'center'});
  ctx.globalAlpha=a;
  const fy=H-(portrait?120*u:90*u);
  text('Starpoint LLC · miglanthony@gmail.com',cx,fy,{size:22,mono:true,color:PAL['ink-2'],align:'center'});
  text('Illustrative replay, one seed, simulation.',cx,fy+38*u,{size:19,mono:true,color:PAL['ink-3'],align:'center'});
  ctx.restore();
}
let L0=null;
function render(t){
  t=Math.max(0,Math.min(DURATION,t));
  readPalette(); if(!W)resize();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAL.bg; ctx.fillRect(0,0,W,H);
  const L=layout(); L0=L;
  const s=Math.max(0,Math.min(T_REPLAY,t-T_TITLE));
  const f=frameAt(s), fPrev=frames[Math.max(0,f.i-(s<f.s?1:0))];
  const fA=frames[Math.max(0,Math.floor(s/DT))], fB=frames[Math.min(N-1,Math.floor(s/DT)+1)];
  drawHeader(L.header,s);
  drawField(L.field,s,fB,fA);
  drawCaption(L.caption,s);
  drawInputs(L.inputs,s,f);
  drawTrace(L.trace,s,f);
  drawTracks(L.tracks,s,f);
  drawFooter(L.footer,s,t);
  drawReceipt(L,s);
  if(t<T_TITLE) drawTitle(t);
  if(t>=T_END) drawEnd(t);
  if(SHOW_UI&&uiState) drawBadge(uiState);
}
let uiState=null;
function drawBadge(label){
  ctx.save(); ctx.font=font(22,500,true); const w=ctx.measureText(label).width+48*u, h=52*u, x=W/2-w/2, y=H*0.5-h/2;
  ctx.globalAlpha=0.92; ctx.fillStyle=PAL.ink; rrect(x,y,w,h,h/2); ctx.fill(); ctx.globalAlpha=1;
  text(label,W/2,y+h*0.66,{size:22,mono:true,weight:500,color:PAL.bg,align:'center'}); ctx.restore();
}

/* ---------- player ---------- */
const q=new URLSearchParams(location.search);
const SHOW_UI=q.get('ui')!=='0';
if(q.get('theme')==='dark'||q.get('theme')==='light') document.documentElement.setAttribute('data-theme',q.get('theme'));
let playing=false, t0=0, tStart=0, raf=0;
function tick(now){ if(!playing)return; const t=tStart+(now-t0)/1000; uiState=null; render(t); if(t>=DURATION){playing=false;tStart=DURATION;uiState='Tap to replay';render(DURATION);return;} raf=requestAnimationFrame(tick); }
function play(from){ tStart=from==null?(tStart>=DURATION?0:tStart):from; t0=performance.now(); playing=true; cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
function pause(){ if(!playing)return; tStart=tStart+(performance.now()-t0)/1000; playing=false; cancelAnimationFrame(raf); uiState='Paused · tap to resume'; render(tStart); }
function toggle(){ playing?pause():play(); }
window.addEventListener('resize',()=>{resize();render(playing?tStart+(performance.now()-t0)/1000:tStart);});
canvas.addEventListener('click',toggle);
canvas.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});
document.getElementById('playBtn').addEventListener('click',()=>{document.getElementById('play').style.display='none';play(0);});

window.__nerva={render,DURATION,FPS:30,frames,receipts,flips,recommit,seed:SEED,seek:t=>{playing=false;cancelAnimationFrame(raf);uiState=null;tStart=t;render(t);}};

resize();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const autoplay=q.get('autoplay')!=='0'&&!reduced;
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{
  if(q.has('t')){ tStart=parseFloat(q.get('t'))||0; render(tStart); return; }
  if(autoplay) play(0);
  else { render(0); if(reduced) document.getElementById('play').style.display='flex'; }
});
</script>
